<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom — Live Chat & Calls</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050510;
    --panel: rgba(10, 15, 35, 0.75);
    --neon: #00f0ff;
    --neon2: #ff00aa;
    --neon3: #7b2fff;
    --text: #e0f7ff;
    --muted: #6a8aaa;
    --border: rgba(0, 240, 255, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Exo 2', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes gridMove {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, 40px); }
  }

  .screen { display: none; height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; }

  /* AUTH */
  #auth { align-items: center; justify-content: center; }
  .auth-card {
    background: var(--panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,240,255,0.15), inset 0 0 20px rgba(0,240,255,0.05);
    position: relative;
    overflow: hidden;
  }
  .auth-card::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(45deg, var(--neon), var(--neon2), var(--neon3), var(--neon));
    z-index: -1;
    border-radius: 22px;
    animation: borderGlow 4s linear infinite;
    opacity: 0.6;
  }
  @keyframes borderGlow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }
  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(0,240,255,0.5);
  }
  .tagline { color: var(--muted); margin-bottom: 32px; font-size: 0.95rem; letter-spacing: 1px; }
  input {
    width: 100%;
    padding: 14px 16px;
    margin: 10px 0;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    font-family: 'Exo 2', sans-serif;
    outline: none;
    transition: all 0.2s;
  }
  input:focus {
    border-color: var(--neon);
    box-shadow: 0 0 12px rgba(0,240,255,0.4);
  }
  .btn {
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    background: linear-gradient(90deg, var(--neon3), var(--neon));
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 700;
    font-size: 1rem;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 15px rgba(0,240,255,0.4);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0,240,255,0.6); }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--neon);
    box-shadow: none;
  }
  .switch { margin-top: 20px; color: var(--muted); cursor: pointer; }
  .switch span { color: var(--neon); }

  /* APP */
  #app { flex-direction: row; }
  .sidebar {
    width: 280px;
    background: var(--panel);
    backdrop-filter: blur(16px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .user-bar {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon), var(--neon3));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.1rem;
    color: #000;
    box-shadow: 0 0 12px var(--neon);
  }
  .friends-list { flex: 1; overflow-y: auto; padding: 12px 0; }
  .friend {
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .friend:hover, .friend.active { background: rgba(0,240,255,0.1); }
  .friend-info { flex: 1; }
  .friend-name { font-weight: 600; }
  .status { font-size: 0.75rem; color: var(--neon); }
  .status.offline { color: var(--muted); }
  .add-friend {
    margin: 12px 16px;
    padding: 10px;
    background: rgba(0,240,255,0.05);
    border: 1px dashed var(--border);
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
  }
  .add-friend:hover { border-color: var(--neon); color: var(--neon); }

  .main { flex: 1; display: flex; flex-direction: column; background: rgba(5,5,16,0.4); }
  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
  }
  .call-btns { display: flex; gap: 10px; }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(0,240,255,0.08);
    border: 1px solid var(--border);
    color: var(--neon);
    cursor: pointer;
    font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 12px var(--neon); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 16px;
    word-wrap: break-word;
  }
  .msg.me {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--neon3), #4a00e0);
    border-bottom-right-radius: 4px;
    box-shadow: 0 0 10px rgba(123,47,255,0.3);
  }
  .msg.them {
    align-self: flex-start;
    background: rgba(0,240,255,0.08);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-time { font-size: 0.7rem; opacity: 0.6; margin-top: 4px; text-align: right; }

  .input-area {
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid var(--border);
  }
  .input-area input { flex: 1; margin: 0; }
  .send-btn {
    padding: 0 24px;
    background: var(--neon);
    color: #000;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    cursor: pointer;
    box-shadow: 0 0 12px var(--neon);
  }
  .send-btn:hover { box-shadow: 0 0 20px var(--neon); }

  #call-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
  }
  #call-overlay.active { display: flex; }
  .videos { display: flex; gap: 20px; margin-bottom: 30px; }
  video {
    width: 380px;
    height: 280px;
    background: #000;
    border-radius: 16px;
    object-fit: cover;
    border: 2px solid var(--neon);
    box-shadow: 0 0 20px rgba(0,240,255,0.3);
  }
  .call-controls { display: flex; gap: 16px; }
  .call-controls .icon-btn { width: 56px; height: 56px; font-size: 1.4rem; }
  .end-call { background: #ff3366 !important; color: white !important; border-color: #ff3366 !important; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal.active { display: flex; }
  .modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 320px;
    box-shadow: 0 0 30px rgba(0,240,255,0.2);
  }
  .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }
  .connection-status {
    position: fixed;
    bottom: 12px;
    right: 12px;
    font-size: 0.8rem;
    padding: 6px 12px;
    background: rgba(0,0,0,0.6);
    border-radius: 20px;
    border: 1px solid var(--border);
    z-index: 10;
  }
  .online { color: var(--neon); }
  .offline { color: #ff6b6b; }
</style>
</head>
<body>

<div id="auth" class="screen active">
  <div class="auth-card">
    <div class="logo">AXIOM</div>
    <div class="tagline">LIVE LINK • SECURE CHANNEL</div>
    <div id="login-form">
      <input id="login-user" placeholder="OPERATOR ID" autocomplete="username">
      <input id="login-pass" type="password" placeholder="ACCESS KEY">
      <div class="error" id="login-error"></div>
      <button class="btn" onclick="login()">INITIATE</button>
      <div class="switch" onclick="showRegister()">NEW OPERATOR? <span>REGISTER</span></div>
    </div>
    <div id="register-form" style="display:none">
      <input id="reg-user" placeholder="CHOOSE OPERATOR ID">
      <input id="reg-pass" type="password" placeholder="CREATE ACCESS KEY">
      <div class="error" id="reg-error"></div>
      <button class="btn" onclick="register()">CREATE LINK</button>
      <div class="switch" onclick="showLogin()">EXISTING? <span>LOGIN</span></div>
    </div>
  </div>
</div>

<div id="app" class="screen">
  <div class="sidebar">
    <div class="user-bar">
      <div class="avatar" id="my-avatar">?</div>
      <div>
        <div id="my-name" style="font-weight:600">User</div>
        <div class="status online">ONLINE</div>
      </div>
      <button class="icon-btn" style="margin-left:auto;width:36px;height:36px" onclick="logout()" title="Logout">⏻</button>
    </div>
    <div class="add-friend" onclick="openAddFriend()">+ ADD CONTACT</div>
    <div class="friends-list" id="friends-list"></div>
  </div>
  <div class="main">
    <div class="chat-header">
      <div>
        <div id="chat-with" style="font-weight:700;font-size:1.1rem">SELECT CONTACT</div>
        <div style="font-size:0.8rem;color:var(--muted)">SECURE CHANNEL</div>
      </div>
      <div class="call-btns">
        <button class="icon-btn" onclick="startCall('audio')" title="Voice call">🎤</button>
        <button class="icon-btn" onclick="startCall('video')" title="Video call">📹</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input id="msg-input" placeholder="TRANSMIT MESSAGE..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" onclick="sendMessage()">SEND</button>
    </div>
  </div>
</div>

<div id="call-overlay">
  <div class="videos">
    <video id="local-video" autoplay muted playsinline></video>
    <video id="remote-video" autoplay playsinline style="border-color:var(--neon2)"></video>
  </div>
  <div style="margin-bottom:12px;font-size:0.9rem;color:var(--muted)" id="call-status">ESTABLISHING LINK...</div>
  <div class="call-controls">
    <button class="icon-btn" id="mute-btn" onclick="toggleMute()">🎤</button>
    <button class="icon-btn" id="cam-btn" onclick="toggleCam()">📹</button>
    <button class="icon-btn end-call" onclick="endCall()">✕</button>
  </div>
</div>

<div id="add-modal" class="modal">
  <div class="modal-card">
    <h3 style="margin-bottom:16px;font-family:'Orbitron'">ADD CONTACT</h3>
    <input id="add-username" placeholder="OPERATOR ID">
    <div class="error" id="add-error"></div>
    <button class="btn" onclick="addFriend()">LINK</button>
    <button class="btn secondary" style="margin-top:8px" onclick="closeModal()">CANCEL</button>
  </div>
</div>

<div class="connection-status" id="conn-status">CONNECTING...</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentUser = null;
let currentChat = null;
let myFriends = [];
let localStream = null;
let peerConnection = null;
let isMuted = false;
let isCamOff = false;
let currentCallPeer = null;
let callType = null;

const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];

socket.on('connect', () => {
  document.getElementById('conn-status').textContent = 'LINK ACTIVE';
  document.getElementById('conn-status').className = 'connection-status online';
});
socket.on('disconnect', () => {
  document.getElementById('conn-status').textContent = 'LINK LOST';
  document.getElementById('conn-status').className = 'connection-status offline';
});
socket.on('kicked', () => {
  alert('Session overridden');
  logout();
});

function showLogin() {
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('register-form').style.display = 'none';
}
function showRegister() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'block';
}

function register() {
  const u = document.getElementById('reg-user').value.trim();
  const p = document.getElementById('reg-pass').value;
  const err = document.getElementById('reg-error');
  err.textContent = '';
  socket.emit('register', { username: u, password: p }, (res) => {
    if (!res.ok) { err.textContent = res.error; return; }
    alert('Operator registered. Please login.');
    showLogin();
    document.getElementById('login-user').value = u;
  });
}

function login() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  socket.emit('login', { username: u, password: p }, (res) => {
    if (!res.ok) { err.textContent = res.error; return; }
    currentUser = res.username;
    myFriends = res.friends || [];
    enterApp();
  });
}

function enterApp() {
  document.getElementById('auth').classList.remove('active');
  document.getElementById('app').classList.add('active');
  document.getElementById('my-name').textContent = currentUser;
  document.getElementById('my-avatar').textContent = currentUser[0].toUpperCase();
  renderFriends();
}

function logout() {
  endCall();
  location.reload();
}

function renderFriends() {
  const list = document.getElementById('friends-list');
  list.innerHTML = '';
  if (myFriends.length === 0) {
    list.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center">No contacts yet.<br>Add one!</div>';
    return;
  }
  myFriends.forEach(f => {
    const div = document.createElement('div');
    div.className = 'friend' + (currentChat === f ? ' active' : '');
    div.innerHTML = `
      <div class="avatar" style="width:36px;height:36px;font-size:0.9rem">${f[0].toUpperCase()}</div>
      <div class="friend-info">
        <div class="friend-name">${f}</div>
        <div class="status online" id="status-${f}">ONLINE</div>
      </div>`;
    div.onclick = () => openChat(f);
    list.appendChild(div);
  });
}

function openAddFriend() {
  document.getElementById('add-modal').classList.add('active');
  document.getElementById('add-username').value = '';
  document.getElementById('add-error').textContent = '';
}
function closeModal() {
  document.getElementById('add-modal').classList.remove('active');
}
function addFriend() {
  const name = document.getElementById('add-username').value.trim();
  const err = document.getElementById('add-error');
  err.textContent = '';
  socket.emit('add-friend', name, (res) => {
    if (!res.ok) { err.textContent = res.error; return; }
    myFriends = res.friends;
    closeModal();
    renderFriends();
  });
}

socket.on('friend-added', (name) => {
  if (!myFriends.includes(name)) {
    myFriends.push(name);
    renderFriends();
  }
});

function openChat(friend) {
  currentChat = friend;
  document.getElementById('chat-with').textContent = friend;
  renderFriends();
  socket.emit('get-messages', friend, (msgs) => {
    renderMessages(msgs);
  });
}

function renderMessages(msgs) {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  (msgs || []).forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === currentUser ? 'me' : 'them');
    div.innerHTML = `${escapeHtml(m.text)}<div class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentChat) return;
  socket.emit('send-message', { to: currentChat, text });
  input.value = '';
}

socket.on('new-message', ({ with: friend, msg }) => {
  if (currentChat === friend) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + (msg.from === currentUser ? 'me' : 'them');
    div.innerHTML = `${escapeHtml(msg.text)}<div class="msg-time">${new Date(msg.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
}

// ---------- Peer-to-peer calls ----------
async function getLocalStream(type) {
  const constraints = {
    audio: true,
    video: type === 'video' ? { width: 640, height: 480 } : false
  };
  return await navigator.mediaDevices.getUserMedia(constraints);
}

function createPeerConnection() {
  const pc = new RTCPeerConnection({ iceServers });
  pc.onicecandidate = (e) => {
    if (e.candidate && currentCallPeer) {
      socket.emit('webrtc-ice', { to: currentCallPeer, candidate: e.candidate });
    }
  };
  pc.ontrack = (e) => {
    document.getElementById('remote-video').srcObject = e.streams[0];
  };
  return pc;
}

async function startCall(type) {
  if (!currentChat) { alert('Select a contact first'); return; }
  if (currentCallPeer) { alert('Already in a call'); return; }
  try {
    localStream = await getLocalStream(type);
    document.getElementById('local-video').srcObject = localStream;
    document.getElementById('call-overlay').classList.add('active');
    document.getElementById('call-status').textContent = `CALLING ${currentChat}...`;
    currentCallPeer = currentChat;
    callType = type;
    isMuted = false; isCamOff = false;
    updateCallButtons();
    socket.emit('call-request', { to: currentChat, type });
  } catch (e) {
    alert('Could not access microphone/camera. Please allow permissions.');
  }
}

socket.on('incoming-call', async ({ from, type }) => {
  if (currentCallPeer) {
    socket.emit('call-reject', { to: from });
    return;
  }
  if (confirm(`${from} is calling (${type}). Accept?`)) {
    try {
      localStream = await getLocalStream(type);
      document.getElementById('local-video').srcObject = localStream;
      document.getElementById('call-overlay').classList.add('active');
      document.getElementById('call-status').textContent = `CONNECTING TO ${from}...`;
      currentCallPeer = from;
      callType = type;
      isMuted = false; isCamOff = false;
      updateCallButtons();
      socket.emit('call-accept', { to: from });
    } catch (e) {
      socket.emit('call-reject', { to: from });
      alert('Could not access microphone/camera.');
    }
  } else {
    socket.emit('call-reject', { to: from });
  }
});

socket.on('call-accepted', async ({ from }) => {
  if (from !== currentCallPeer) return;
  document.getElementById('call-status').textContent = `LINKED WITH ${from}`;
  peerConnection = createPeerConnection();
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit('webrtc-offer', { to: from, offer });
});

socket.on('call-rejected', ({ from }) => {
  if (from === currentCallPeer) {
    alert(`${from} declined the call`);
    endCall();
  }
});

socket.on('webrtc-offer', async ({ from, offer }) => {
  if (from !== currentCallPeer) return;
  peerConnection = createPeerConnection();
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit('webrtc-answer', { to: from, answer });
  document.getElementById('call-status').textContent = `LINKED WITH ${from}`;
});

socket.on('webrtc-answer', async ({ from, answer }) => {
  if (from !== currentCallPeer || !peerConnection) return;
  await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
});

socket.on('webrtc-ice', async ({ from, candidate }) => {
  if (from !== currentCallPeer || !peerConnection) return;
  try {
    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
  } catch (e) {}
});

socket.on('call-ended', ({ from }) => {
  if (from === currentCallPeer) {
    endCall();
  }
});

function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  updateCallButtons();
}
function toggleCam() {
  if (!localStream) return;
  isCamOff = !isCamOff;
  localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
  updateCallButtons();
}
function updateCallButtons() {
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🎤';
  document.getElementById('cam-btn').textContent = isCamOff ? '📷' : '📹';
}
function endCall() {
  if (currentCallPeer) {
    socket.emit('call-end', { to: currentCallPeer });
  }
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  document.getElementById('local-video').srcObject = null;
  document.getElementById('remote-video').srcObject = null;
  document.getElementById('call-overlay').classList.remove('active');
  currentCallPeer = null;
  callType = null;
}
</script>
</body>
</html>
